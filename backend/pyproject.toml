[project]
name = "supportflow-crm"
version = "0.1.0"
description = "Full-stack customer support CRM for managing support tickets, customer information, ticket status, and team notes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
    "psycopg[binary]>=3.3.5",
    "aiosqlite>=0.22.1",
]
